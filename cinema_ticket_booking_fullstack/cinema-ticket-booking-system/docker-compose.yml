version: '3.9'
services:
  mongodb:
    image: mongo:7.0
    container_name: cineverse-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: cineverse-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/cineverse
      - JWT_SECRET=super_secret_cineverse_jwt_key_2026
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: cineverse-frontend
    restart: always
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongo_data:
